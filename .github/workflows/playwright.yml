name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: pnpm exec playwright test

    # Single-file HTML so the downloaded artifact opens directly in a browser
    # (a multi-file Allure report needs a web server to load its data).
    - name: Generate Allure HTML report
      if: ${{ !cancelled() }}
      run: pnpm exec allure awesome allure-results --single-file --output allure-report --report-name "Interesse QA - Run #${{ github.run_number }}"
    - name: Upload Allure HTML report
      id: upload-allure
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Publish GitHub job summary
      if: ${{ !cancelled() }}
      env:
        ALLURE_REPORT_URL: ${{ steps.upload-allure.outputs.artifact-url }}
      run: node scripts/github-summary.mjs reports/playwright-results.json
